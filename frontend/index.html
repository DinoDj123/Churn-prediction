<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <title>Churn Prediction</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Churn Prediction</h1>
  <p>Predviđanje odlaska korisnika i preporuke za zadržavanje</p>
</header>

<div class="stats" id="stats">
  <div class="loading">Učitavanje...</div>
</div>

<div class="filters">
  <label>Min. rizik:</label>
  <input type="number" id="minRisk" value="0" min="0" max="1" step="0.1" style="width:70px">
  <label>Ugovor:</label>
  <select id="contractFilter">
    <option value="">Svi</option>
    <option value="Month-to-month">Mjesečni</option>
    <option value="One year">Godišnji</option>
    <option value="Two year">Dvogodišnji</option>
  </select>
  <button onclick="loadCustomers()">Filtriraj</button>
</div>

<div class="content">
  <div class="list" id="customerList"><div class="loading">Učitavanje...</div></div>
  <div class="detail" id="detail">
    <div class="placeholder">← Odaberi korisnika sa liste za detalje</div>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
